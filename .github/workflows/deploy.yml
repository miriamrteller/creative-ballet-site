# Publish the site to Cloudflare Pages on every push to main.
# One-time setup (GitHub → Settings → Secrets and variables → Actions):
#   secret   CLOUDFLARE_API_TOKEN   token with "Cloudflare Pages: Edit"
#   variable CF_PAGES_PROJECT       optional: Pages project name. If unset, the project serving
#                                   creativeballetacademy.com is found automatically.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
env:
  # Cloudflare account id (an identifier, not a password)
  CLOUDFLARE_ACCOUNT_ID: 73444954157cf5349ba1cc8f7eb1617c
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check setup and find the Pages project
        id: setup
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PROJECT: ${{ vars.CF_PAGES_PROJECT }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Deploy is not set up yet: add the CLOUDFLARE_API_TOKEN secret (see the top of this file)."
            exit 1
          fi
          if [ -z "$PROJECT" ]; then
            RESP=$(curl -sS -H "Authorization: Bearer $TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects")
            echo "$RESP" | jq -r 'if .success then "Pages projects: " + ([.result[] | .name + " " + ((.domains // []) | join(","))] | join(" | ")) else "Cloudflare error: " + (.errors | tostring) end'
            PROJECT=$(echo "$RESP" | jq -r '[.result[]? | select(((.domains // []) | index("creativeballetacademy.com")) or ((.domains // []) | index("www.creativeballetacademy.com")))][0].name // empty')
          fi
          if [ -z "$PROJECT" ]; then
            echo "::error::No Pages project serves creativeballetacademy.com. Set the CF_PAGES_PROJECT variable."
            exit 1
          fi
          echo "Deploying to Pages project: $PROJECT"
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
      - name: Copy site files (leave out repo-only files)
        run: |
          mkdir -p dist
          rsync -a --exclude '.git' --exclude '.github' --exclude 'README.md' --exclude 'dist' ./ dist/
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 pages deploy dist --project-name "${{ steps.setup.outputs.project }}" --branch main --commit-dirty=true
