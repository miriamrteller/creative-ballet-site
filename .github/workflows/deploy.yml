# Publish the site to Cloudflare Pages on every push to main.
# One-time setup (GitHub → Settings → Secrets and variables → Actions):
#   secret   CLOUDFLARE_API_TOKEN   token with "Cloudflare Pages: Edit"
#   secret   CLOUDFLARE_ACCOUNT_ID  your Cloudflare account id
#   variable CF_PAGES_PROJECT       the Pages project name serving creativeballetacademy.com
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check setup
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CF_PAGES_PROJECT }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ] || [ -z "$PROJECT" ]; then
            echo "::error::Deploy is not set up yet: add CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and CF_PAGES_PROJECT (see the top of this file)."
            exit 1
          fi
      - name: Copy site files (leave out repo-only files)
        run: |
          mkdir -p dist
          rsync -a --exclude '.git' --exclude '.github' --exclude 'README.md' --exclude 'dist' ./ dist/
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist --project-name "${{ vars.CF_PAGES_PROJECT }}" --branch main --commit-dirty=true
